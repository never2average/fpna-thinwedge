[package]
name = "thinwedge-backend-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thinwedge-backend-openapi-models = { path = "../thinwedge-backend-openapi-models" }
thinwedge-api = { workspace = true }
thinwedge-client = { workspace = true }
thinwedge-login = { workspace = true }
thinwedge-model-provider = { workspace = true }
thinwedge-protocol = { workspace = true }

[dev-dependencies]
pretty_assertions = "1"
