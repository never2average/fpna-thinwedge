[package]
edition.workspace = true
license.workspace = true
name = "thinwedge-core"
version.workspace = true

[lib]
doctest = false
name = "thinwedge_core"
path = "src/lib.rs"

[[bin]]
name = "thinwedge-write-config-schema"
path = "src/bin/config_schema.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bm25 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
thinwedge-analytics = { workspace = true }
thinwedge-api = { workspace = true }
thinwedge-app-server-protocol = { workspace = true }
thinwedge-apply-patch = { workspace = true }
thinwedge-async-utils = { workspace = true }
thinwedge-code-mode = { workspace = true }
thinwedge-connectors = { workspace = true }
thinwedge-config = { workspace = true }
thinwedge-core-plugins = { workspace = true }
thinwedge-core-skills = { workspace = true }
thinwedge-exec-server = { workspace = true }
thinwedge-features = { workspace = true }
thinwedge-feedback = { workspace = true }
thinwedge-login = { workspace = true }
thinwedge-memories-read = { workspace = true }
thinwedge-mcp = { workspace = true }
thinwedge-model-provider-info = { workspace = true }
thinwedge-models-manager = { workspace = true }
thinwedge-shell-command = { workspace = true }
thinwedge-execpolicy = { workspace = true }
thinwedge-git-utils = { workspace = true }
thinwedge-hooks = { workspace = true }
thinwedge-network-proxy = { workspace = true }
thinwedge-otel = { workspace = true }
thinwedge-plugin = { workspace = true }
thinwedge-model-provider = { workspace = true }
thinwedge-protocol = { workspace = true }
thinwedge-response-debug-context = { workspace = true }
thinwedge-rollout = { workspace = true }
thinwedge-rollout-trace = { workspace = true }
thinwedge-rmcp-client = { workspace = true }
thinwedge-sandboxing = { workspace = true }
thinwedge-state = { workspace = true }
thinwedge-terminal-detection = { workspace = true }
thinwedge-thread-store = { workspace = true }
thinwedge-tools = { workspace = true }
thinwedge-utils-absolute-path = { workspace = true }
thinwedge-utils-cache = { workspace = true }
thinwedge-utils-image = { workspace = true }
thinwedge-utils-home-dir = { workspace = true }
thinwedge-utils-output-truncation = { workspace = true }
thinwedge-utils-path = { workspace = true }
thinwedge-utils-plugins = { workspace = true }
thinwedge-utils-pty = { workspace = true }
thinwedge-utils-readiness = { workspace = true }
thinwedge-utils-string = { workspace = true }
thinwedge-utils-stream-parser = { workspace = true }
thinwedge-utils-template = { workspace = true }
thinwedge-windows-sandbox = { package = "thinwedge-windows-sandbox", path = "../windows-sandbox-rs" }
csv = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
env-flags = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
indexmap = { workspace = true }
libc = { workspace = true }
notify = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex-lite = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5"] }
which = { workspace = true }
whoami = { workspace = true }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
thinwedge-shell-escalation = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
thinwedge-otel = { workspace = true }
thinwedge-test-binary-support = { workspace = true }
thinwedge-utils-cargo-bin = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
insta = { workspace = true }
maplit = { workspace = true }
opentelemetry = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
test-case = "3.3.1"
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
