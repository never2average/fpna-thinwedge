[package]
name = "thinwedge-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "thinwedge-app-server"
path = "src/main.rs"

[[bin]]
name = "thinwedge-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[lib]
name = "thinwedge_app_server"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
thinwedge-analytics = { workspace = true }
thinwedge-api = { workspace = true }
thinwedge-arg0 = { workspace = true }
thinwedge-cloud-requirements = { workspace = true }
thinwedge-config = { workspace = true }
thinwedge-core = { workspace = true }
thinwedge-core-plugins = { workspace = true }
thinwedge-device-key = { workspace = true }
thinwedge-exec-server = { workspace = true }
thinwedge-external-agent-migration = { workspace = true }
thinwedge-external-agent-sessions = { workspace = true }
thinwedge-features = { workspace = true }
thinwedge-git-utils = { workspace = true }
thinwedge-otel = { workspace = true }
thinwedge-shell-command = { workspace = true }
thinwedge-utils-cli = { workspace = true }
thinwedge-utils-pty = { workspace = true }
thinwedge-backend-client = { workspace = true }
thinwedge-file-search = { workspace = true }
thinwedge-chatgpt = { workspace = true }
thinwedge-login = { workspace = true }
thinwedge-memories-write = { workspace = true }
thinwedge-mcp = { workspace = true }
thinwedge-model-provider = { workspace = true }
thinwedge-models-manager = { workspace = true }
thinwedge-protocol = { workspace = true }
thinwedge-app-server-protocol = { workspace = true }
thinwedge-feedback = { workspace = true }
thinwedge-rmcp-client = { workspace = true }
thinwedge-rollout = { workspace = true }
thinwedge-sandboxing = { workspace = true }
thinwedge-state = { workspace = true }
thinwedge-thread-store = { workspace = true }
thinwedge-tools = { workspace = true }
thinwedge-uds = { workspace = true }
thinwedge-utils-absolute-path = { workspace = true }
thinwedge-utils-json-to-toml = { workspace = true }
thinwedge-utils-rustls-provider = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
constant_time_eq = { workspace = true }
futures = { workspace = true }
gethostname = { workspace = true }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
owo-colors = { workspace = true, features = ["supports-colors"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }

[dev-dependencies]
app_test_support = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
core_test_support = { workspace = true }
thinwedge-model-provider-info = { workspace = true }
thinwedge-utils-cargo-bin = { workspace = true }
flate2 = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
rmcp = { workspace = true, default-features = false, features = [
    "elicitation",
    "server",
    "transport-streamable-http-server",
] }
serial_test = { workspace = true }
tar = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing-opentelemetry = { workspace = true }
wiremock = { workspace = true }
shlex = { workspace = true }
