[package]
edition.workspace = true
license.workspace = true
name = "thinwedge-goal-extension"
version.workspace = true

[lib]
name = "thinwedge_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
thinwedge-analytics = { workspace = true }
thinwedge-core = { workspace = true }
thinwedge-extension-api = { workspace = true }
thinwedge-otel = { workspace = true }
thinwedge-protocol = { workspace = true }
thinwedge-state = { workspace = true }
thinwedge-tools = { workspace = true }
thinwedge-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
