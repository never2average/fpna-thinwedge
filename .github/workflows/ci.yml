name: PR Gate

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate (required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify thinwedge-rs Cargo manifests inherit workspace settings
        run: python3 .github/scripts/verify_cargo_workspace_manifests.py

      - name: Verify thinwedge-tui does not import thinwedge-core directly
        run: python3 .github/scripts/verify_tui_core_boundary.py

      - name: Verify Bazel clippy flags match Cargo workspace lints
        run: python3 .github/scripts/verify_bazel_clippy_lints.py

      - name: Check public release readiness blockers
        run: python3 scripts/check_public_release_readiness.py

      - name: DB sandbox release smoke
        run: |
          set -euo pipefail
          scripts/probes/check-db-sandbox-readiness.sh --dry-run
          scripts/probes/check-db-sandbox-readiness.sh --source-provider neon --branch-backend none --include-branch-lifecycle --dry-run
          scripts/probes/check-db-sandbox-readiness.sh --source-provider planetscale --branch-backend none --dry-run
          python3 - <<'PY'
          import json
          schema = json.load(open("thinwedge-rs/core/config.schema.json", encoding="utf-8"))
          props = schema.get("properties", {})
          assert "db_sandbox" in props, "config schema must expose db_sandbox"
          assert "ardent" in props, "config schema must keep optional Ardent settings"
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # stage_npm_packages.py requires DotSlash when staging releases.
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Stage npm package
        id: stage_npm_package
        run: |
          set -euo pipefail
          OUTPUT_DIR="${RUNNER_TEMP}"
          python3 ./thinwedge-cli/scripts/build_npm_package.py \
            --release-version "0.0.0-ci" \
            --package thinwedge \
            --staging-dir "${OUTPUT_DIR}/thinwedge-npm-stage" \
            --pack-output "${OUTPUT_DIR}/thinwedge-cli-npm-0.0.0-ci.tgz"
          PACK_OUTPUT="${OUTPUT_DIR}/thinwedge-cli-npm-0.0.0-ci.tgz"
          echo "pack_output=$PACK_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload staged npm package artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: thinwedge-cli-npm-staging
          path: ${{ steps.stage_npm_package.outputs.pack_output }}

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        run: ./scripts/asciicheck.py README.md
      - name: Check root README ToC
        run: python3 scripts/readme_toc.py README.md

      - name: Prettier (run `pnpm run format:fix` to fix)
        run: pnpm run format
