version: 2.1

jobs:
  smoke:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Show repo and git context
          command: |
            set -euo pipefail
            echo "repo: ${CIRCLE_PROJECT_REPONAME}"
            echo "branch: ${CIRCLE_BRANCH:-}"
            echo "tag: ${CIRCLE_TAG:-}"
            git rev-parse --short HEAD
      - run:
          name: Show workspace contents
          command: |
            set -euo pipefail
            pwd
            ls -la
            test -f thinwedge-rs/Cargo.toml

  tag-check:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Validate release tag
          command: |
            set -euo pipefail
            test -n "${CIRCLE_TAG:-}"
            [[ "${CIRCLE_TAG}" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$ ]]
            tag_ver="${CIRCLE_TAG#rust-v}"
            cargo_ver="$(grep -m1 '^version' thinwedge-rs/Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
            if [ "${tag_ver}" != "${cargo_ver}" ]; then
              echo "tag ${tag_ver} does not match Cargo.toml ${cargo_ver}"
              exit 1
            fi

  build-linux-x64:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-cargo-linux-x64-{{ checksum "thinwedge-rs/Cargo.lock" }}
            - v1-cargo-linux-x64-
      - run:
          name: Install Linux build dependencies
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              curl \
              pkg-config \
              libcap-dev
      - run:
          name: Install Rust toolchain
          command: |
            set -euo pipefail
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain 1.93.0
            . "$HOME/.cargo/env"
            rustup target add x86_64-unknown-linux-gnu
            cargo --version
      - run:
          name: Build Linux x64 release binaries
          no_output_timeout: 120m
          command: |
            set -euo pipefail
            . "$HOME/.cargo/env"
            cd thinwedge-rs
            CARGO_PROFILE_RELEASE_LTO=false \
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 \
            cargo build --target x86_64-unknown-linux-gnu --release \
              --bin thinwedge \
              --bin thinwedge-responses-api-proxy
      - run:
          name: Stage Linux x64 release assets
          command: |
            set -euo pipefail
            base="/tmp/circleci-release"
            target="x86_64-unknown-linux-gnu"
            release_dir="$HOME/project/thinwedge-rs/target/${target}/release"

            mkdir -p "${base}/native/vendor/${target}/thinwedge"
            mkdir -p "${base}/release-assets"

            cp "${release_dir}/thinwedge" "${base}/native/vendor/${target}/thinwedge/thinwedge"
            tar -C "${release_dir}" -czf "${base}/release-assets/thinwedge-${target}.tar.gz" thinwedge
            tar -C "${release_dir}" -czf "${base}/release-assets/thinwedge-responses-api-proxy-${target}.tar.gz" thinwedge-responses-api-proxy
      - save_cache:
          key: v1-cargo-linux-x64-{{ checksum "thinwedge-rs/Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ~/.rustup
            - ~/project/thinwedge-rs/target
      - persist_to_workspace:
          root: /tmp/circleci-release
          paths:
            - native
            - release-assets

  build-macos-arm64:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-cargo-macos-arm64-{{ checksum "thinwedge-rs/Cargo.lock" }}
            - v1-cargo-macos-arm64-
      - run:
          name: Install Rust toolchain
          command: |
            set -euo pipefail
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain 1.93.0
            . "$HOME/.cargo/env"
            rustup target add aarch64-apple-darwin
            cargo --version
      - run:
          name: Build macOS ARM64 release binaries
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            . "$HOME/.cargo/env"
            cd thinwedge-rs
            CARGO_PROFILE_RELEASE_LTO=false \
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 \
            cargo build --target aarch64-apple-darwin --release \
              --bin thinwedge \
              --bin thinwedge-responses-api-proxy
      - run:
          name: Stage macOS ARM64 release assets
          command: |
            set -euo pipefail
            base="/tmp/circleci-release"
            target="aarch64-apple-darwin"
            release_dir="$HOME/project/thinwedge-rs/target/${target}/release"

            mkdir -p "${base}/native/vendor/${target}/thinwedge"
            mkdir -p "${base}/release-assets"

            cp "${release_dir}/thinwedge" "${base}/native/vendor/${target}/thinwedge/thinwedge"
            tar -C "${release_dir}" -czf "${base}/release-assets/thinwedge-${target}.tar.gz" thinwedge
            tar -C "${release_dir}" -czf "${base}/release-assets/thinwedge-responses-api-proxy-${target}.tar.gz" thinwedge-responses-api-proxy
      - save_cache:
          key: v1-cargo-macos-arm64-{{ checksum "thinwedge-rs/Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ~/.rustup
            - ~/project/thinwedge-rs/target
      - persist_to_workspace:
          root: /tmp/circleci-release
          paths:
            - native
            - release-assets

  build-macos-x64:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-cargo-macos-x64-{{ checksum "thinwedge-rs/Cargo.lock" }}
            - v1-cargo-macos-x64-
      - run:
          name: Install Rust toolchain
          command: |
            set -euo pipefail
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain 1.93.0
            . "$HOME/.cargo/env"
            rustup target add x86_64-apple-darwin
            cargo --version
      - run:
          name: Build macOS x64 release binaries
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            . "$HOME/.cargo/env"
            cd thinwedge-rs
            CARGO_PROFILE_RELEASE_LTO=false \
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 \
            cargo build --target x86_64-apple-darwin --release \
              --bin thinwedge \
              --bin thinwedge-responses-api-proxy
      - run:
          name: Stage macOS x64 release assets
          command: |
            set -euo pipefail
            base="/tmp/circleci-release"
            target="x86_64-apple-darwin"
            release_dir="$HOME/project/thinwedge-rs/target/${target}/release"

            mkdir -p "${base}/native/vendor/${target}/thinwedge"
            mkdir -p "${base}/release-assets"

            cp "${release_dir}/thinwedge" "${base}/native/vendor/${target}/thinwedge/thinwedge"
            tar -C "${release_dir}" -czf "${base}/release-assets/thinwedge-${target}.tar.gz" thinwedge
            tar -C "${release_dir}" -czf "${base}/release-assets/thinwedge-responses-api-proxy-${target}.tar.gz" thinwedge-responses-api-proxy
      - save_cache:
          key: v1-cargo-macos-x64-{{ checksum "thinwedge-rs/Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - ~/.rustup
            - ~/project/thinwedge-rs/target
      - persist_to_workspace:
          root: /tmp/circleci-release
          paths:
            - native
            - release-assets

  publish-release:
    docker:
      - image: cimg/node:24.11
    working_directory: ~/project
    environment:
      CIRCLECI_RELEASE_ROOT: /tmp/circleci-release
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/circleci-release
      - run:
          name: Verify publish credentials
          command: |
            set -euo pipefail
            test -n "${GH_TOKEN:-}" || { echo "GH_TOKEN is required"; exit 1; }
            test -n "${NPM_TOKEN:-}" || { echo "NPM_TOKEN is required"; exit 1; }
      - run:
          name: Install release tooling
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gh python3 jq
      - run:
          name: Prepare npm vendor tree
          command: |
            set -euo pipefail
            python3 thinwedge-cli/scripts/install_native_deps.py --component rg "${CIRCLECI_RELEASE_ROOT}/native"
      - run:
          name: Build npm tarballs
          environment:
            VERSION: << pipeline.git.tag >>
          command: |
            set -euo pipefail
            version="${CIRCLE_TAG#rust-v}"
            vendor_src="${CIRCLECI_RELEASE_ROOT}/native/vendor"
            mkdir -p dist/npm
            packages=(
              thinwedge
              thinwedge-linux-x64
              thinwedge-darwin-x64
              thinwedge-darwin-arm64
            )

            for package in "${packages[@]}"; do
              staging_dir="$(mktemp -d)"
              case "${package}" in
                thinwedge)
                  pack_output="dist/npm/thinwedge-cli-npm-${version}.tgz"
                  ;;
                *)
                  platform="${package#thinwedge-}"
                  pack_output="dist/npm/thinwedge-cli-npm-${platform}-${version}.tgz"
                  ;;
              esac
              python3 thinwedge-cli/scripts/build_npm_package.py \
                --package "${package}" \
                --release-version "${version}" \
                --staging-dir "${staging_dir}" \
                --pack-output "${pack_output}" \
                --vendor-src "${vendor_src}"
            done
      - run:
          name: Stage GitHub release assets
          command: |
            set -euo pipefail
            cp scripts/install/install.sh dist/install.sh
            cp scripts/install/install.ps1 dist/install.ps1
            cp thinwedge-rs/core/config.schema.json dist/config-schema.json
            git log -1 --format=%B "${CIRCLE_SHA1}" > /tmp/release-notes.md
            echo >> /tmp/release-notes.md
      - run:
          name: Publish GitHub release assets
          command: |
            set -euo pipefail
            version="${CIRCLE_TAG#rust-v}"
            assets=(
              "${CIRCLECI_RELEASE_ROOT}/release-assets/"*
              dist/npm/*
              dist/install.sh
              dist/install.ps1
              dist/config-schema.json
            )

            if gh release view "${CIRCLE_TAG}" >/dev/null 2>&1; then
              gh release upload "${CIRCLE_TAG}" "${assets[@]}" --clobber
            else
              gh release create "${CIRCLE_TAG}" "${assets[@]}" \
                --title "${version}" \
                --notes-file /tmp/release-notes.md
            fi
      - run:
          name: Publish npm packages
          command: |
            set -euo pipefail
            version="${CIRCLE_TAG#rust-v}"
            prefix=""
            if [[ "${version}" == *-alpha.* ]]; then
              prefix="alpha-"
              npm_tag="alpha"
            else
              npm_tag=""
            fi

            root_tarball="dist/npm/thinwedge-cli-npm-${version}.tgz"
            platform_tarballs=(
              "dist/npm/thinwedge-cli-npm-linux-x64-${version}.tgz"
              "dist/npm/thinwedge-cli-npm-darwin-x64-${version}.tgz"
              "dist/npm/thinwedge-cli-npm-darwin-arm64-${version}.tgz"
            )

            tarballs=(
              "${platform_tarballs[@]}"
              "${root_tarball}"
            )

            for tarball in "${tarballs[@]}"; do
              filename="$(basename "${tarball}")"
              tag=""

              case "${filename}" in
                thinwedge-cli-npm-linux-*-"${version}".tgz|thinwedge-cli-npm-darwin-*-"${version}".tgz)
                  platform="${filename#thinwedge-cli-npm-}"
                  platform="${platform%-${version}.tgz}"
                  tag="${prefix}${platform}"
                  ;;
                thinwedge-cli-npm-"${version}".tgz)
                  tag="${npm_tag}"
                  ;;
              esac

              publish_cmd=(npm publish "${PWD}/${tarball}")
              if [[ -n "${tag}" ]]; then
                publish_cmd+=(--tag "${tag}")
              fi
              if [[ -z "${tag}" ]]; then
                publish_cmd+=(--access public)
              fi

              echo "+ ${publish_cmd[*]}"
              set +e
              publish_output="$("${publish_cmd[@]}" 2>&1)"
              publish_status=$?
              set -e
              echo "${publish_output}"
              if [[ ${publish_status} -eq 0 ]]; then
                continue
              fi
              if printf '%s\n' "${publish_output}" | grep -qiE "previously published|cannot publish over|version already exists"; then
                echo "Skipping already-published package version for ${filename}"
                continue
              fi
              exit "${publish_status}"
            done

workflows:
  ci:
    jobs:
      - smoke:
          filters:
            tags:
              ignore: /.*/

  release:
    jobs:
      - tag-check:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^rust-v.*/
      - build-linux-x64:
          requires:
            - tag-check
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^rust-v.*/
      - build-macos-arm64:
          requires:
            - tag-check
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^rust-v.*/
      - build-macos-x64:
          requires:
            - tag-check
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^rust-v.*/
      - publish-release:
          requires:
            - build-linux-x64
            - build-macos-arm64
            - build-macos-x64
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^rust-v.*/
